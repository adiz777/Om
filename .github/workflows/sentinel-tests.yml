name: Om Sentinel tests

on:
  push:
    branches: [main, "feat/om-sentinel-full-scale"]
    paths:
      - "sentinel/**"
      - ".github/workflows/sentinel-tests.yml"
  pull_request:
    paths:
      - "sentinel/**"
      - ".github/workflows/sentinel-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentinel/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
