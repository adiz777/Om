name: Om Sentinel tests
on:
  push:
    paths:
      - 'sentinel/**'
      - '.github/workflows/om-sentinel.yml'
  pull_request:
    paths:
      - 'sentinel/**'
      - '.github/workflows/om-sentinel.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sentinel/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
