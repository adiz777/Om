services:
  om-sentinel:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Local-only by default. Put behind a TLS reverse proxy before remote access.
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
